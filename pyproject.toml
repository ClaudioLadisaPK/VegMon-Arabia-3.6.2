[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "msimne"
version = "0.3.0"
description = "Sentinel-2 processing pipeline for composites, NDVI, mosaics, and AOI statistics."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Ladisa" }
]
dependencies = [
  "dask",
  "distributed",
  "geopandas",
  "numpy",
  "odc-stac",
  "pandas",
  "planetary-computer",
  "pyogrio",
  "pyproj",
  "psutil",
  "pystac-client>=0.7",
  "python-dateutil",
  "rasterio",
  "requests",
  "rioxarray",
  "shapely>=2.0",
  "tqdm",
  "xarray",
]

[project.optional-dependencies]
dev = [
  "pytest",
]

[project.scripts]
msimne = "msimne.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
